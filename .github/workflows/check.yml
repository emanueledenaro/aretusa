name: Check and publish docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run quality:check
      - run: node scripts/check-usage.mjs
      - run: node scripts/verify-consumer.mjs
      - run: npm ci --prefix examples/react-hook-form
      - run: npm test --prefix examples/react-hook-form
      - run: npm run build --prefix examples/react-hook-form
      - run: npm ci --prefix examples/tanstack-form
      - run: npm test --prefix examples/tanstack-form
      - run: npm run build --prefix examples/tanstack-form
      - run: npm ci --prefix examples/formisch
      - run: npm test --prefix examples/formisch
      - run: npm run build --prefix examples/formisch
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist/docs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
